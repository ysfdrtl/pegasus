# Builds the app, the firmware simulator and the offline tests on Linux and Windows, then runs
# the tests (ctest). The UI self-tests need a screen and are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Derle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Testler
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # LunarG's own installer, silent. LunarG keeps roughly the last year of SDKs online:
      # bump the version when the download starts to fail.
      - name: Vulkan SDK (önbellek)
        id: vkcache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.363.1-windows
      - name: Vulkan SDK (kurulum)
        if: steps.vkcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = "1.4.363.1"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install"
      - name: Vulkan SDK (ortam)
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Get-ChildItem C:\VulkanSDK | Select-Object -First 12
      - name: Derle (MSVC)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j4
      - name: Testler
        run: ctest --test-dir build -C Release --output-on-failure
