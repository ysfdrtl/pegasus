# Builds the app, the firmware simulator and the offline tests on Linux and Windows, then runs
# the tests (ctest). The UI self-tests need a screen and are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Derle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Testler
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          # LunarG keeps roughly the last year of SDKs online: bump this when the download 404s
          version: 1.4.363.1
          cache: true
      - name: Derle (MSVC)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j4
      - name: Testler
        run: ctest --test-dir build -C Release --output-on-failure
